version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: metalclean_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: metalclean
      POSTGRES_PASSWORD: metalclean_dev
      POSTGRES_DB: metalclean
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U metalclean']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: metalclean_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: metalclean_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: metalclean_meili_dev
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - meilisearch_data:/meili_data

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
